<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - Smart Pharmacy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">💊 Smart Pharmacy</div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('add') }}">Medicines</a>
            <a href="{{ url_for('expiring_soon') }}">Expiry Alerts</a>
            <a href="{{ url_for('expired') }}">Expired</a>
        </nav>
    </header>

    <section class="form-section">
        <h2>Add New Medicine</h2>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('add') }}" class="medicine-form">

            <label for="name">Medicine Name *</label>
            <input type="text" id="name" name="name" required>

            <label for="brand">Brand</label>
            <input type="text" id="brand" name="brand">

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>

            <label for="mfg_date">Manufacture Date *</label>
            <input type="date" id="mfg_date" name="mfg_date" required>

            <label for="exp_date">Expiry Date *</label>
            <input type="date" id="exp_date" name="exp_date" required>

            <label for="quantity">Quantity *</label>
            <input type="number" id="quantity" name="quantity" min="0" required>

            <button type="submit">Add Medicine</button>

        </form>
    </section>

</body>
</html>
